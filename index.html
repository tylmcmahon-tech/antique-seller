<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f4ee"><title>Antique Seller</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f4ee;color:#29251f;font-family:-apple-system,BlinkMacSystemFont,Arial}.app{max-width:760px;margin:auto;padding:25px 15px 80px}header,.bar,.head{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{margin:2px 0;font-size:31px}.tiny{margin:0;font-size:10px;letter-spacing:1px;color:#74695e;font-weight:800}.add,.save{background:#955d32;color:#fff;border:0;border-radius:13px;padding:12px 15px;font-size:16px;font-weight:800}.totals{display:grid;grid-template-columns:repeat(4,1fr);margin:20px 0 16px;padding:13px 5px;border-radius:16px;background:#e8dfd3}.totals div{text-align:center;border-right:1px solid #d5c7b8}.totals div:last-child{border:0}.totals b,.totals span{display:block}.totals span{font-size:11px;color:#74695e;margin-top:3px}input,textarea,select{width:100%;padding:10px;border:1px solid #dfd5c8;border-radius:10px;background:#fffefa;font:inherit}.search{margin-bottom:10px}.filters{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.filters button{white-space:nowrap;border:1px solid #dfd5c8;background:none;border-radius:20px;padding:8px 11px;color:#74695e}.filters .on{background:#29251f;color:white}.list{display:grid;gap:11px}.card{display:grid;grid-template-columns:94px 1fr;gap:12px;padding:11px;border:1px solid #e4dbcf;border-radius:17px;background:#fffdfa}.pic{width:94px;height:112px;overflow:hidden;border:1px dashed #bcae9c;border-radius:11px;background:#f1ebe4;color:#74695e;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;font-weight:700}.pic img{width:100%;height:100%;object-fit:cover}.head h2{font-size:17px;margin:3px 0}.edit{border:0;border-radius:9px;padding:7px;color:#955d32;font-weight:800}.desc{margin:7px 0;color:#74695e;font-size:13px}.prices{display:grid;grid-template-columns:repeat(3,1fr);font-size:14px}.prices span{display:block;font-size:10px;text-transform:uppercase;color:#74695e}.buttons{display:flex;gap:9px;align-items:center;margin-top:9px;font-size:12px;font-weight:700}.buttons label{display:flex;gap:4px;align-items:center}.buttons input{width:30px;height:18px;accent-color:#417b61}.condition{margin-left:auto;color:#74695e}.empty{text-align:center;color:#74695e;padding:40px}dialog{border:0;padding:0;width:min(100%,600px);height:100dvh;background:#f7f4ee}dialog::backdrop{background:#29251f88}form{padding:22px 17px 35px}form>label{display:block;margin:14px 0;font-size:13px;font-weight:800}form label input,form label textarea,form label select{margin-top:5px;font-weight:400}.photo{height:160px;position:relative;border:2px dashed #bcae9c;border-radius:15px;background:#eee6dc;display:flex!important;align-items:center;justify-content:center;text-align:center;color:#74695e}.photo img{width:100%;height:100%;object-fit:cover;border-radius:13px}.photo input{position:absolute;inset:0;opacity:0}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.switch{display:flex!important;justify-content:space-between;align-items:center;border-top:1px solid #e4dbcf;padding-top:13px}.switch input{width:48px;height:28px;accent-color:#417b61}.actions{display:flex;justify-content:space-between;margin-top:19px}.delete{border:0;background:none;color:#a04c43;font-weight:800}.close{border:0;border-radius:50%;font-size:24px;width:35px;height:35px}@media(max-width:380px){.card{grid-template-columns:82px 1fr}.pic{width:82px}.prices{font-size:13px}}</style></head><body><main class="app"><header><div><p class="tiny">YOUR INVENTORY</p><h1>Antique Seller</h1></div><button class="add" onclick="openForm()">＋ Add</button></header><section class="totals"><div><b id="count"></b><span>Items</span></div><div><b id="asking"></b><span>Asking</span></div><div><b id="soldtotal"></b><span>Sold</span></div><div><b id="left"></b><span>Left</span></div></section><input class="search" id="search" oninput="render()" placeholder="Search your antiques"><div class="filters"><button class="on" onclick="setFilter(this,'all')">All</button><button onclick="setFilter(this,'unlisted')">Not listed</button><button onclick="setFilter(this,'listed')">Listed</button><button onclick="setFilter(this,'sold')">Sold</button></div><section id="list" class="list"></section></main><dialog id="dialog"><form id="form"><div class="head"><div><p id="kicker" class="tiny">NEW LISTING</p><h2 id="title">Add an item</h2></div><button class="close" type="button" onclick="dialog.close()">×</button></div><label class="photo" id="photoBox">▧<br>Add photo<input id="photo" type="file" accept="image/*" capture="environment"></label><label>Item name<input id="name" required></label><label>Description<textarea id="description" rows="3"></textarea></label><div class="two"><label>Item number<input id="number" inputmode="numeric"></label><label>Condition<select id="condition"><option>Good</option><option>Fair</option><option>Damaged</option><option>Untested</option></select></label></div><div class="two"><label>Asking price<input id="price" type="number" min="0" step=".01"></label><label>Lowest price<input id="low" type="number" min="0" step=".01"></label></div><label>Sold price<input id="soldprice" type="number" min="0" step=".01"></label><label class="switch">Listed<input id="listed" type="checkbox"></label><label class="switch">Sold<input id="sold" type="checkbox"></label><div class="actions"><button class="delete" id="del" type="button">Delete</button><button class="save">Save item</button></div></form></dialog><script>
const seed=[['1','Humphrey Radiantfire No. 60','1920s gas heater; untested',350,0,'Untested'],['2','Vintage Vanity','Classic vintage vanity; age and wear',100,0,'Fair'],['3','Airline Standing Record Player / Radio','Broken leg; untested',100,0,'Untested'],['4','Vintage Metal Sink','Drainboard; rust and age',40,0,'Fair'],['5','Vintage Fishing Rod','Older rod; visible wear',75,0,'Fair'],['6','Vintage Portable Record Player','Untested',50,0,'Untested'],['7','Vintage Metal Gate','Chipped paint',50,0,'Fair'],['8','Blue & Pink Metal Tub / Planter','Galvanized and painted',45,0,'Fair'],['9','Vintage Planter','Aged and weathered',55,0,'Fair'],['10','Silver Couch','Needs cleaning',150,0,'Fair'],['11','TV','Used television',0,0,'Untested'],['12','Saratoga Track Frame','Vintage Saratoga racing piece',0,0,'Good'],['13','Brown Stoneware Jug with Handle','Separate brown stoneware jug',75,60,'Good'],['14','Large Cream Stoneware Crock','Brown rim and dark interior',55,45,'Good'],['15','Cream Stoneware Crock','Separate physical item; brown rim',45,35,'Good'],['16','Cream Crock with Blue/Red Flowers','Floral decoration',65,50,'Good'],['17','Black & Cream Two-Tone Crock','Two-tone stoneware',55,40,'Good'],['18','Small Crock with Side Handles','Small handled crock',40,30,'Good'],['19','Stoneware Crock Marked “5”','Large 5 marking; needs research',95,50,'Good'],['20','Stained-Glass Dome Lamp / Shade','Approx. 10–11 inches',75,50,'Good'],['21','4-Piece Pewter Serving Set','Four pieces',125,90,'Good'],['22','Grand Rapids Showcase Cabinet','Wood and glass; major value item',1200,800,'Good'],['23','Vintage Pedestal Sink','Porcelain and chrome',100,75,'Fair'],['24','Salon Shampoo Chair','Black chair with shampoo bowl',350,250,'Good'],['25','Magic Chef Appliance','Vintage countertop appliance',25,15,'Untested'],['26','Futon #1','Futon',50,30,'Fair'],['27','Futon #2','Futon',50,30,'Fair'],['28','Square Coffee Table','Square table',40,25,'Fair'],['29','Overdyed Green Runner #1','Price not entered',0,0,'Good'],['30','Overdyed Green Runner #2','Price not entered',0,0,'Good'],['31','Extra-Large Teal Planter','Price not entered',0,0,'Good'],['32','Blue Gliding Chair','Price not entered',0,0,'Good'],['33','Terra Cotta Lot','Group of terra-cotta items',0,0,'Fair'],['34','Lamp with Chain','Hanging-chain lamp',0,0,'Untested'],['35','Blue Lamp','Blue lamp',0,0,'Untested']].map(x=>({id:crypto.randomUUID(),n:x[0],name:x[1],d:x[2],p:x[3],l:x[4],c:x[5],sp:0,listed:false,sold:false,img:''}));let items=JSON.parse(localStorage.antiques||'null')||seed,mode='all',edit=null,pic='';const $=x=>document.querySelector(x),cash=x=>x?'$'+Number(x).toLocaleString():'—';function save(){localStorage.antiques=JSON.stringify(items)}function setFilter(b,m){mode=m;document.querySelectorAll('.filters button').forEach(x=>x.classList.toggle('on',x===b));render()}function render(){let q=search.value.toLowerCase(),a=items.filter(x=>(x.name+x.d+x.n).toLowerCase().includes(q)&&(mode==='all'||mode==='sold'&&x.sold||mode==='listed'&&x.listed&&!x.sold||mode==='unlisted'&&!x.listed&&!x.sold));count.textContent=items.length;asking.textContent=cash(items.filter(x=>!x.sold).reduce((a,x)=>a+x.p,0));soldtotal.textContent=cash(items.reduce((a,x)=>a+x.sp,0));left.textContent=items.filter(x=>!x.sold).length;list.innerHTML=a.length?'':'<p class="empty">No matching antiques yet.</p>';a.forEach(x=>list.innerHTML+=`<article class="card"><button class="pic" onclick="openForm('${x.id}')">${x.img?'<img src="'+x.img+'">':'▧<br>Add photo'}</button><div><div class="head"><div><p class="tiny">ITEM #${x.n||'NEW'}</p><h2>${x.name}</h2></div><button class="edit" onclick="openForm('${x.id}')">Edit</button></div><p class="desc">${x.d||'No description yet.'}</p><div class="prices"><div><span>Asking</span><b>${cash(x.p)}</b></div><div><span>Lowest</span><b>${cash(x.l)}</b></div><div><span>Sold</span><b>${cash(x.sp)}</b></div></div><div class="buttons"><label>Listed <input onchange="flip('${x.id}','listed',this.checked)" type="checkbox" ${x.listed?'checked':''}></label><label>Sold <input onchange="flip('${x.id}','sold',this.checked)" type="checkbox" ${x.sold?'checked':''}></label><b class="condition">${x.c}</b></div></div></article>`)}function flip(id,k,v){items.find(x=>x.id===id)[k]=v;save();render()}function openForm(id){edit=id?items.find(x=>x.id===id):null;form.reset();pic=edit?.img||'';photoBox.innerHTML=pic?'<img src="'+pic+'"><input id="photo" type="file" accept="image/*" capture="environment">':'▧<br>Add photo<input id="photo" type="file" accept="image/*" capture="environment">';if(edit){kicker.textContent='EDIT LISTING';title.textContent='Edit item';name.value=edit.name;description.value=edit.d;number.value=edit.n;condition.value=edit.c;price.value=edit.p||'';low.value=edit.l||'';soldprice.value=edit.sp||'';listed.checked=edit.listed;sold.checked=edit.sold}else{kicker.textContent='NEW LISTING';title.textContent='Add an item'}del.style.visibility=edit?'visible':'hidden';dialog.showModal();photo.onchange=e=>{let r=new FileReader;r.onload=()=>{pic=r.result;photoBox.innerHTML='<img src="'+pic+'">'};r.readAsDataURL(e.target.files[0])}}form.onsubmit=e=>{e.preventDefault();let x={id:edit?.id||crypto.randomUUID(),n:number.value,name:name.value,d:description.value,p:+price.value||0,l:+low.value||0,c:condition.value,sp:+soldprice.value||0,listed:listed.checked,sold:sold.checked,img:pic};items=edit?items.map(a=>a.id===x.id?x:a):[x,...items];save();dialog.close();render()};del.onclick=()=>{if(edit&&confirm('Delete this item?')){items=items.filter(x=>x.id!==edit.id);save();dialog.close();render()}};render();
</script></body></html>
