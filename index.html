<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Antique Seller</title><style>body{margin:0;background:#f6f3ed;font:16px -apple-system,Arial;color:#29251f}main{max-width:700px;margin:auto;padding:20px}header,.row{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{margin:0 0 16px}button,.save{border:0;border-radius:11px;padding:10px 13px;font:inherit;font-weight:bold}.add,.save{background:#955d32;color:white}.total{display:grid;grid-template-columns:repeat(4,1fr);background:#e8ded1;border-radius:15px;padding:12px;text-align:center;margin-bottom:15px}.total small{display:block;color:#71685e}.card{display:grid;grid-template-columns:85px 1fr;gap:12px;background:#fffdfa;border:1px solid #e3d9cc;border-radius:16px;padding:11px;margin:10px 0;cursor:pointer}.pic{height:104px;border:1px dashed #b9a995;border-radius:10px;overflow:hidden;background:#eee6dd;display:grid;place-items:center;text-align:center;color:#71685e}.pic img{width:100%;height:100%;object-fit:cover}h2{font-size:17px;margin:3px 0}.tiny{font-size:11px;color:#71685e;margin:0}.price{display:grid;grid-template-columns:repeat(3,1fr);font-size:14px;margin-top:9px}.price small{display:block;color:#71685e}.cond{color:#71685e;font-size:12px;margin-top:8px}dialog{border:0;width:min(100%,600px);height:100dvh;background:#f6f3ed}form{padding:18px}label{display:block;margin:12px 0;font-size:13px;font-weight:bold}input,textarea,select{box-sizing:border-box;width:100%;padding:10px;border:1px solid #ddd2c4;border-radius:9px;background:#fffefa;font:inherit;margin-top:4px}.photo{height:150px;border:2px dashed #b9a995;border-radius:14px;background:#eee6dd;display:grid;place-items:center;text-align:center;position:relative;color:#71685e}.photo input{position:absolute;inset:0;opacity:0}.photo img{width:100%;height:100%;object-fit:cover}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.toggle{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #e3d9cc;padding-top:10px}.toggle input{width:45px;height:25px;accent-color:#417b61}.actions{display:flex;justify-content:space-between;margin-top:18px}.delete{color:#a04c43;background:none}</style><main><header><div><p class="tiny">YOUR INVENTORY</p><h1>Antique Seller</h1></div><button class="add" onclick="openItem()">＋ Add</button></header><section class="total"><div><b id="count"></b><small>Items</small></div><div><b id="ask"></b><small>Asking</small></div><div><b id="soldT"></b><small>Sold</small></div><div><b id="left"></b><small>Left</small></div></section><input id="search" placeholder="Search your antiques" oninput="draw()"><section id="list"></section></main><dialog id="d"><form id="form"><div class="row"><h2 id="title">Add item</h2><button type="button" onclick="d.close()">×</button></div><label id="photoBox" class="photo">▧<br>Add or upload picture<br><small>Tap here to choose or take a picture</small><input id="photo" type="file" accept="image/*"></label><label>Name<input id="name" required></label><label>Description<textarea id="desc"></textarea></label><div class="two"><label>Item number<input id="num"></label><label>Condition<select id="condition"><option>Used</option><option>Fair</option><option>Good</option><option>New</option></select></label></div><div class="two"><label>Asking price<input id="price" type="number"></label><label>Lowest price<input id="low" type="number"></label></div><label>Sold price<input id="sp" type="number"></label><label class="toggle">Listed<input id="listed" type="checkbox"></label><label class="toggle">Sold<input id="sold" type="checkbox"></label><div class="actions"><button class="delete" type="button" id="del">Delete</button><button class="save">Save</button></div></form></dialog><script>
let S=[['Humphrey Radiantfire No. 60',350],['Vintage Vanity',100],['Airline Standing Record Player / Radio',100],['Vintage Metal Sink',40],['Vintage Fishing Rod',75],['Vintage Portable Record Player',50],['Vintage Metal Gate',50],['Blue & Pink Metal Tub / Planter',45],['Vintage Planter',55],['Silver Couch',150],['TV',0],['Saratoga Track Frame',0],['Brown Stoneware Jug with Handle',75],['Large Cream Stoneware Crock',55],['Cream Stoneware Crock',45],['Cream Crock with Blue/Red Flowers',65],['Black & Cream Two-Tone Crock',55],['Small Crock with Side Handles',40],['Stoneware Crock Marked 5',95],['Stained-Glass Dome Lamp / Shade',75],['4-Piece Pewter Serving Set',125],['Grand Rapids Showcase Cabinet',1200],['Vintage Pedestal Sink',100],['Salon Shampoo Chair',350],['Magic Chef Appliance',25],['Futon #1',50],['Futon #2',50],['Square Coffee Table',40],['Overdyed Green Runner #1',0],['Overdyed Green Runner #2',0],['Extra-Large Teal Planter',0],['Blue Gliding Chair',0],['Terra Cotta Lot',0],['Lamp with Chain',0],['Blue Lamp',0]].map((x,i)=>({id:crypto.randomUUID(),n:i+1,name:x[0],p:x[1],low:0,sp:0,c:'Used',d:'',listed:false,sold:false,img:''}));let I=JSON.parse(localStorage.aseller||'null')||S,E=null,P='';const $=x=>document.querySelector(x),M=x=>x?'$'+x.toLocaleString():'—';function keep(){localStorage.aseller=JSON.stringify(I)}function draw(){let a=I.filter(x=>(x.name+x.d).toLowerCase().includes(search.value.toLowerCase()));count.textContent=I.length;ask.textContent=M(I.filter(x=>!x.sold).reduce((z,x)=>z+x.p,0));soldT.textContent=M(I.reduce((z,x)=>z+x.sp,0));left.textContent=I.filter(x=>!x.sold).length;list.innerHTML='';a.forEach(x=>{let q=document.createElement('article');q.className='card';q.onclick=()=>openItem(x.id);q.innerHTML='<div class="pic">'+(x.img?'<img src="'+x.img+'">':'▧<br>Add picture')+'</div><div><p class="tiny">ITEM #'+x.n+'</p><h2>'+x.name+'</h2><p class="tiny">'+(x.d||'Tap this item to edit it.')+'</p><div class="price"><div><small>Asking</small><b>'+M(x.p)+'</b></div><div><small>Lowest</small><b>'+M(x.low)+'</b></div><div><small>Sold</small><b>'+M(x.sp)+'</b></div></div><b class="cond">'+x.c+'</b></div>';list.append(q)})}function openItem(id){E=id?I.find(x=>x.id===id):null;form.reset();P=E?.img||'';photoBox.innerHTML=P?'<img src="'+P+'"><input id="photo" type="file" accept="image/*">':'▧<br>Add or upload picture<br><small>Tap here to choose or take a picture</small><input id="photo" type="file" accept="image/*">';if(E){title.textContent='Edit item';name.value=E.name;desc.value=E.d;num.value=E.n;condition.value=E.c;price.value=E.p;low.value=E.low;sp.value=E.sp;listed.checked=E.listed;sold.checked=E.sold;del.style.visibility='visible'}else{title.textContent='Add item';del.style.visibility='hidden'}d.showModal();photo.onchange=e=>{let r=new FileReader;r.onload=()=>{P=r.result;photoBox.innerHTML='<img src="'+P+'">'};r.readAsDataURL(e.target.files[0])}}form.onsubmit=e=>{e.preventDefault();let x={id:E?.id||crypto.randomUUID(),n:num.value||I.length+1,name:name.value,d:desc.value,p:+price.value||0,low:+low.value||0,sp:+sp.value||0,c:condition.value,listed:listed.checked,sold:sold.checked,img:P};I=E?I.map(y=>y.id===x.id?x:y):[x,...I];keep();d.close();draw()};del.onclick=()=>{if(E&&confirm('Delete this item?')){I=I.filter(x=>x.id!==E.id);keep();d.close();draw()}};draw();</script>
