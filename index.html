<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Antique Seller</title><style>body{margin:0;background:#f6f3ed;color:#27231e;font:16px -apple-system,BlinkMacSystemFont,Arial}.app{max-width:750px;margin:auto;padding:22px 15px 75px}header,.h,.actions{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{margin:2px 0 20px}.add,.save{border:0;background:#935a30;color:white;border-radius:12px;padding:12px 14px;font-weight:800;font-size:16px}.totals{display:grid;grid-template-columns:repeat(4,1fr);background:#e8ded1;border-radius:15px;padding:12px;margin-bottom:15px;text-align:center}.totals b,.totals small{display:block}.totals small,.tiny,.desc{color:#71685e}.totals small,.tiny{font-size:11px}.search,input,textarea,select{box-sizing:border-box;width:100%;padding:10px;border:1px solid #ddd2c4;border-radius:10px;background:#fffdfa;font:inherit}.filters{display:flex;gap:7px;overflow:auto;margin:10px 0}.filters button{border:1px solid #ddd2c4;border-radius:20px;padding:7px 10px;background:none;white-space:nowrap}.filters .on{background:#27231e;color:white}.list{display:grid;gap:11px}.card{display:grid;grid-template-columns:90px 1fr;gap:11px;padding:11px;border:1px solid #e4d9cc;border-radius:16px;background:#fffdfa}.pic{height:110px;border:1px dashed #bba995;border-radius:11px;overflow:hidden;background:#eee6dd;display:flex;align-items:center;justify-content:center;text-align:center;color:#71685e;font-weight:bold}.pic img{width:100%;height:100%;object-fit:cover}h2{font-size:17px;margin:2px 0}.edit{border:0;border-radius:8px;padding:7px;color:#935a30;font-weight:bold}.desc{font-size:13px;margin:7px 0}.prices{display:grid;grid-template-columns:repeat(3,1fr);font-size:14px}.prices small{display:block;color:#71685e}.checks{display:flex;gap:10px;align-items:center;margin-top:9px;font-size:12px;font-weight:bold}.checks input{width:27px}.cond{margin-left:auto;color:#71685e}.empty{text-align:center;color:#71685e;padding:40px}dialog{width:min(100%,600px);height:100dvh;border:0;padding:0;background:#f6f3ed}form{padding:22px 17px}form>label{display:block;margin:13px 0;font-size:13px;font-weight:bold}form label input,form label textarea,form label select{margin-top:5px;font-weight:normal}.photo{height:155px;border:2px dashed #bba995;border-radius:15px;background:#eee6dd;display:flex!important;align-items:center;justify-content:center;text-align:center;position:relative;color:#71685e}.photo input{position:absolute;inset:0;opacity:0}.photo img{width:100%;height:100%;object-fit:cover}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.toggle{display:flex!important;justify-content:space-between;align-items:center;border-top:1px solid #e4d9cc;padding-top:11px}.toggle input{width:45px;height:26px;accent-color:#40795e}.delete,.close{border:0;background:none;color:#a14940;font-weight:bold}.close{font-size:25px}.actions{margin-top:18px}@media(max-width:380px){.card{grid-template-columns:80px 1fr}.pic{height:100px}}</style><main class="app"><header><div><p class="tiny">YOUR INVENTORY</p><h1>Antique Seller</h1></div><button class="add" onclick="formOpen()">＋ Add</button></header><section class="totals"><div><b id="n"></b><small>Items</small></div><div><b id="a"></b><small>Asking</small></div><div><b id="st"></b><small>Sold</small></div><div><b id="lft"></b><small>Left</small></div></section><input id="q" class="search" oninput="draw()" placeholder="Search your antiques"><div class="filters"><button class="on" onclick="filt(this,'all')">All</button><button onclick="filt(this,'unlisted')">Not listed</button><button onclick="filt(this,'listed')">Listed</button><button onclick="filt(this,'sold')">Sold</button></div><section id="list" class="list"></section></main><dialog id="box"><form id="form"><div class="h"><div><p id="kind" class="tiny">NEW LISTING</p><h2 id="ttl">Add an item</h2></div><button class="close" type="button" onclick="box.close()">×</button></div><label id="photoBox" class="photo">▧<br><b>Add or upload picture</b><br><small>Tap here, then choose a photo or take one</small><input id="photo" type="file" accept="image/*"></label><label>Item name<input id="name" required></label><label>Description<textarea id="desc" rows="3"></textarea></label><div class="two"><label>Item number<input id="num"></label><label>Condition<select id="condition"><option>Used</option><option>Fair</option><option>Good</option><option>New</option></select></label></div><div class="two"><label>Asking price<input id="price" type="number"></label><label>Lowest price<input id="low" type="number"></label></div><label>Sold price<input id="soldPrice" type="number"></label><label class="toggle">Listed<input id="listed" type="checkbox"></label><label class="toggle">Sold<input id="sold" type="checkbox"></label><div class="actions"><button class="delete" id="del" type="button">Delete</button><button class="save">Save item</button></div></form></dialog><script>
let data=[['Humphrey Radiantfire No. 60',350,0],['Vintage Vanity',100,0],['Airline Standing Record Player / Radio',100,0],['Vintage Metal Sink',40,0],['Vintage Fishing Rod',75,0],['Vintage Portable Record Player',50,0],['Vintage Metal Gate',50,0],['Blue & Pink Metal Tub / Planter',45,0],['Vintage Planter',55,0],['Silver Couch',150,0],['TV',0,0],['Saratoga Track Frame',0,0],['Brown Stoneware Jug with Handle',75,60],['Large Cream Stoneware Crock',55,45],['Cream Stoneware Crock',45,35],['Cream Crock with Blue/Red Flowers',65,50],['Black & Cream Two-Tone Crock',55,40],['Small Crock with Side Handles',40,30],['Stoneware Crock Marked 5',95,50],['Stained-Glass Dome Lamp / Shade',75,50],['4-Piece Pewter Serving Set',125,90],['Grand Rapids Showcase Cabinet',1200,800],['Vintage Pedestal Sink',100,75],['Salon Shampoo Chair',350,250],['Magic Chef Appliance',25,15],['Futon #1',50,30],['Futon #2',50,30],['Square Coffee Table',40,25],['Overdyed Green Runner #1',0,0],['Overdyed Green Runner #2',0,0],['Extra-Large Teal Planter',0,0],['Blue Gliding Chair',0,0],['Terra Cotta Lot',0,0],['Lamp with Chain',0,0],['Blue Lamp',0,0]].map((x,i)=>({id:crypto.randomUUID(),no:i+1,name:x[0],d:'',p:x[1],low:x[2],c:'Used',sp:0,listed:false,sold:false,img:''}));let items=JSON.parse(localStorage.antiqueSeller||'null')||data,filter='all',now=null,picture='';const $=x=>document.querySelector(x),money=x=>x?'$'+x.toLocaleString():'—';function keep(){localStorage.antiqueSeller=JSON.stringify(items)}function filt(b,x){filter=x;document.querySelectorAll('.filters button').forEach(y=>y.classList.toggle('on',y===b));draw()}function draw(){let v=items.filter(x=>(x.name+x.d+x.no).toLowerCase().includes(q.value.toLowerCase())&&(filter==='all'||filter==='sold'&&x.sold||filter==='listed'&&x.listed&&!x.sold||filter==='unlisted'&&!x.listed&&!x.sold));n.textContent=items.length;a.textContent=money(items.filter(x=>!x.sold).reduce((z,x)=>z+x.p,0));st.textContent=money(items.reduce((z,x)=>z+x.sp,0));lft.textContent=items.filter(x=>!x.sold).length;list.innerHTML=v.length?'':'<p class="empty">No matching antiques.</p>';v.forEach(x=>list.innerHTML+=`<article class="card"><button class="pic" onclick="formOpen('${x.id}')">${x.img?'<img src="'+x.img+'">':'▧<br>Add picture'}</button><div><div class="h"><div><p class="tiny">ITEM #${x.no}</p><h2>${x.name}</h2></div><button class="edit" onclick="formOpen('${x.id}')">Edit</button></div><p class="desc">${x.d||'No description yet.'}</p><div class="prices"><div><small>Asking</small><b>${money(x.p)}</b></div><div><small>Lowest</small><b>${money(x.low)}</b></div><div><small>Sold</small><b>${money(x.sp)}</b></div></div><div class="checks"><label>Listed <input type="checkbox" onchange="flip('${x.id}','listed',this.checked)" ${x.listed?'checked':''}></label><label>Sold <input type="checkbox" onchange="flip('${x.id}','sold',this.checked)" ${x.sold?'checked':''}></label><b class="cond">${x.c}</b></div></div></article>`)}function flip(id,k,v){items.find(x=>x.id===id)[k]=v;keep();draw()}function formOpen(id){now=id?items.find(x=>x.id===id):null;form.reset();picture=now?.img||'';photoBox.innerHTML=picture?'<img src="'+picture+'"><input id="photo" type="file" accept="image/*">':'▧<br><b>Add or upload picture</b><br><small>Tap here, then choose a photo or take one</small><input id="photo" type="file" accept="image/*">';if(now){kind.textContent='EDIT LISTING';ttl.textContent='Edit item';name.value=now.name;desc.value=now.d;num.value=now.no;condition.value=['Used','Fair','Good','New'].includes(now.c)?now.c:'Used';price.value=now.p||'';low.value=now.low||'';soldPrice.value=now.sp||'';listed.checked=now.listed;sold.checked=now.sold;del.style.visibility='visible'}else{kind.textContent='NEW LISTING';ttl.textContent='Add an item';del.style.visibility='hidden'}box.showModal();photo.onchange=e=>{let r=new FileReader;r.onload=()=>{picture=r.result;photoBox.innerHTML='<img src="'+picture+'"><input id="photo" type="file" accept="image/*">'};r.readAsDataURL(e.target.files[0])}}form.onsubmit=e=>{e.preventDefault();let x={id:now?.id||crypto.randomUUID(),no:num.value||items.length+1,name:name.value,d:desc.value,p:+price.value||0,low:+low.value||0,c:condition.value,sp:+soldPrice.value||0,listed:listed.checked,sold:sold.checked,img:picture};items=now?items.map(y=>y.id===x.id?x:y):[x,...items];keep();box.close();draw()};del.onclick=()=>{if(now&&confirm('Delete this item?')){items=items.filter(x=>x.id!==now.id);keep();box.close();draw()}};draw();</script>
